<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Leave · iCampus</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#14221f;--mut:#6b7c78;--ac:#1f8a70;--bd:#dfe8e5;--no:#c0392b;--wa:#d9962b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2a28;--card:#223633;--tx:#e8f2ef;--mut:#92a9a4;--ac:#3ecfa8;--bd:#2f4642}}
:root[data-theme="dark"]{--bg:#1a2a28;--card:#223633;--tx:#e8f2ef;--mut:#92a9a4;--ac:#3ecfa8;--bd:#2f4642}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 84px;max-width:560px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:20px 0 10px}
.mut{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bal{text-align:center;padding:12px 6px}.bal b{font-size:24px;display:block;color:var(--ac)}
.bar{height:5px;background:var(--bd);border-radius:5px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}
.link{background:none;border:0;color:var(--ac);margin-top:12px;width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.Approved{color:var(--ac)}.Rejected{color:var(--no)}.Pending{color:var(--wa)}
.act{display:flex;gap:8px;margin-top:10px}.act button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.act .y{background:var(--ac);color:#fff;border:0}
.ic{background:none;border:1px solid var(--bd);border-radius:10px;padding:6px 10px;color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0;font-size:12px}
nav button.on{color:var(--ac);font-weight:700}
.err{color:var(--no);font-size:13px;margin-top:10px}.ok{color:var(--ac);font-size:13px;margin-top:10px}
</style></head>
<body>
<div class="top"><div><h1 id="hi">iCampus</h1><div class="mut">Teacher Leave Portal</div></div><div><button class="ic" onclick="theme()">◐</button> <button class="ic" id="out" onclick="logout()" hidden>Logout</button></div></div>
<div id="app"></div>
<nav id="nav" hidden></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== 1) PASTE YOUR SUPABASE VALUES HERE (Project Settings -> API) ======
const SUPABASE_URL = "https://xzqzkrvlqpyaoktkgcbb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_m8xRE27duwPNRz9mtQvGXA_sgJ2lGp3";
// =========================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const T={CL:["Casual Leave",12],ML:["Medical Leave",10],EL:["Earned Leave",15]};
let me=null,prof=null,L=[],view="home",mode="login",err="",msg="";
const q=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const fmt=d=>new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const isAdmin=()=>prof&&prof.role=="admin";
const mine=()=>L.filter(l=>l.user_id==me.id);
const used=k=>mine().filter(l=>l.type==k&&l.status!="Rejected").reduce((n,l)=>n+l.days,0);
function theme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"}
function go(v){view=v;err="";render()}

async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  me=session?session.user:null;
  if(me)await load();
  render();
}
async function load(){
  const p=await sb.from("profiles").select("*").eq("id",me.id).single();
  prof=p.data;
  const r=await sb.from("leaves").select("*,profiles(name)").order("created_at",{ascending:false});
  L=r.data||[];
}
async function auth(){
  err="";msg="";
  const email=q("em").value.trim(),pw=q("pw").value,name=mode=="signup"?q("nm").value.trim():"";
  if(!email||pw.length<6||(mode=="signup"&&!name)){err="Fill all fields (password min 6 characters).";return render()}
  if(mode=="signup"){
    const r=await sb.auth.signUp({email,password:pw,options:{data:{name}}});
    if(r.error){err=r.error.message;return render()}
    if(!r.data.session){msg="Account created. Check your email to confirm, then login.";mode="login";return render()}
    me=r.data.user;
  }else{
    const r=await sb.auth.signInWithPassword({email,password:pw});
    if(r.error){err=r.error.message;return render()}
    me=r.data.user;
  }
  view="home";await load();render();
}
async function logout(){await sb.auth.signOut();me=null;prof=null;L=[];render()}
async function submitLeave(){
  const t=q("t").value,f=q("f").value,to=q("to").value,r=q("r").value.trim();
  if(!f||!to||!r){err="Please fill all fields.";return render()}
  const d=days(f,to);
  if(d<1){err="End date can't be before start date.";return render()}
  if(d>T[t][1]-used(t)){err="Not enough "+T[t][0]+" balance.";return render()}
  const res=await sb.from("leaves").insert({type:t,from_date:f,to_date:to,days:d,reason:r});
  if(res.error){err=res.error.message;return render()}
  await load();go("history");
}
async function dec(id,s){
  const res=await sb.from("leaves").update({status:s}).eq("id",id);
  if(res.error){alert(res.error.message);return}
  await load();render();
}
function item(l,adm){
  return `<div class="card"><div class="row"><div><b>${T[l.type][0]}</b> · ${l.days} day${l.days>1?"s":""}<div class="mut">${fmt(l.from_date)}${l.from_date!=l.to_date?" – "+fmt(l.to_date):""}${adm?" · "+esc(l.profiles&&l.profiles.name||"Teacher"):""}</div></div><span class="tag ${l.status}">${l.status}</span></div><div class="mut" style="margin-top:8px">${esc(l.reason)}</div>${adm&&l.status=="Pending"?`<div class="act"><button onclick="dec(${l.id},'Rejected')">Reject</button><button class="y" onclick="dec(${l.id},'Approved')">Approve</button></div>`:""}</div>`;
}
function render(){
  const app=q("app"),nav=q("nav");
  q("out").hidden=!me;nav.hidden=!me;
  if(!me){
    q("hi").textContent="iCampus";
    app.innerHTML=`<div class="card" style="margin-top:20px"><b>${mode=="login"?"Login":"Create account"}</b>${mode=="signup"?`<label>Your name</label><input id="nm" placeholder="e.g. Sunita Sharma">`:""}<label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password">${err?`<div class="err">${esc(err)}</div>`:""}${msg?`<div class="ok">${esc(msg)}</div>`:""}<button class="btn" onclick="auth()">${mode=="login"?"Login":"Sign up"}</button><button class="link" onclick="mode='${mode=="login"?"signup":"login"}';err='';render()">${mode=="login"?"New teacher? Create account":"Have an account? Login"}</button></div>`;
    return;
  }
  q("hi").textContent="Hey, "+(prof&&prof.name?prof.name:"there");
  let h="";
  if(view=="home"){
    h+=`<h2>Leave balance</h2><div class="grid">`+Object.keys(T).map(k=>{const left=T[k][1]-used(k);return `<div class="card bal"><b>${left}</b><span class="mut">${k} left</span><div class="bar"><i style="width:${left/T[k][1]*100}%"></i></div></div>`}).join("")+`</div>`;
    h+=`<div class="card row"><span>My pending requests</span><b>${mine().filter(l=>l.status=="Pending").length}</b></div><h2>Recent</h2>`+(mine().slice(0,3).map(l=>item(l)).join("")||`<div class="mut">No leaves yet.</div>`);
  }
  if(view=="apply"){
    h+=`<h2>Apply for leave</h2><div class="card"><label>Leave type</label><select id="t">${Object.keys(T).map(k=>`<option value="${k}">${T[k][0]} (${T[k][1]-used(k)} left)</option>`).join("")}</select><label>From</label><input type="date" id="f"><label>To</label><input type="date" id="to"><label>Reason</label><textarea id="r" rows="3" placeholder="Reason for leave"></textarea>${err?`<div class="err">${esc(err)}</div>`:""}<button class="btn" onclick="submitLeave()">Submit request</button></div>`;
  }
  if(view=="history")h+=`<h2>My leave history</h2>`+(mine().map(l=>item(l)).join("")||`<div class="mut">No leaves yet.</div>`);
  if(view=="approve"){const p=L.filter(l=>l.status=="Pending");h+=`<h2>Pending approvals</h2>`+(p.map(l=>item(l,1)).join("")||`<div class="mut">No pending requests.</div>`);}
  app.innerHTML=h;
  const tabs=[["home","Home"],["apply","Apply"],["history","History"]];
  if(isAdmin())tabs.push(["approve","Approve"]);
  nav.innerHTML=tabs.map(([v,l])=>`<button class="${view==v?"on":""}" onclick="go('${v}')">${l}</button>`).join("");
}
boot();
</script></body></html>
